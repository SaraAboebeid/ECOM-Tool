<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MR Table — Authoring</title>
<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
    :root {
        --ink: #e8e8e8;
        --ink-dim: #9a9a9a;
        --panel: #2f2f2f;
        --panel-raised: #383838;
        --line: #454545;
        --action: #e8eef6;
        --action-ink: #141a22;
        --building: #ff00a6;
        --street: #eaff00;
        --tree: #7dffb0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
        color: var(--ink);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
    }

    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }

    /* Tools. Bottom edge, thumb height, 48px targets - the iPad is the point of
       this view even while it still runs in a second window on the laptop. */
    #tools {
        position: absolute;
        left: 12px; right: 12px; bottom: 12px;
        display: flex;
        gap: 8px;
        padding: 8px;
        background: rgba(30, 30, 30, 0.94);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        z-index: 5;
    }

    .tool {
        flex: 1;
        min-height: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 6px 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
    }
    .tool small { color: var(--ink-dim); font-size: 10px; font-weight: 400; }
    .tool:active { background: var(--panel-raised); }
    .tool[aria-pressed="true"] { border-color: currentColor; }
    .tool[data-tool="block"][aria-pressed="true"] { color: var(--building); background: rgba(255, 0, 166, 0.12); }
    .tool[data-tool="street"][aria-pressed="true"] { color: var(--street); background: rgba(234, 255, 0, 0.12); }
    .tool[data-tool="treeline"][aria-pressed="true"] { color: var(--tree); background: rgba(125, 255, 176, 0.12); }
    .tool[aria-pressed="true"] small { color: inherit; opacity: 0.75; }

    /* Commit bar. Appears only when there is something pending, so the resting
       state of the screen is the map. */
    #pending {
        position: absolute;
        left: 12px; right: 12px; bottom: 84px;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: rgba(30, 30, 30, 0.96);
        border: 1px solid var(--line);
        border-radius: 12px;
        z-index: 6;
    }
    #pending.show { display: flex; }
    #pending-label { flex: 1; font-size: 13px; }
    #pending-label b { font-weight: 600; }

    button.commit, button.minor {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--line);
    }
    button.commit { background: var(--action); color: var(--action-ink); border-color: var(--action); }
    button.minor { background: transparent; color: var(--ink-dim); }
    button:disabled { opacity: 0.4; cursor: default; }

    /* Height picker, shown for the block tool only. */
    #height-row {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--ink-dim);
        font-size: 12px;
    }
    #height-row.show { display: flex; }
    #height-row input { width: 96px; }
    #height-value { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 42px; }

    /* Scene list. Top right, deliberately small - it is a record, not a control
       panel; the map is where the work happens. */
    #scene {
        position: absolute;
        top: 12px; right: 12px;
        width: 210px;
        max-height: 44vh;
        display: flex;
        flex-direction: column;
        background: rgba(30, 30, 30, 0.94);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        z-index: 5;
    }
    #scene header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-dim);
    }
    #scene-list { overflow-y: auto; padding: 4px; margin: 0; list-style: none; }
    #scene-list li {
        padding: 6px 8px;
        font-size: 12px;
        border-left: 2px solid var(--line);
        margin-bottom: 2px;
        color: var(--ink);
    }
    #scene-list li small { display: block; color: var(--ink-dim); font-size: 10px; }
    #scene-list li.buildings { border-left-color: var(--building); }
    #scene-list li.streets { border-left-color: var(--street); }
    #scene-list li.trees { border-left-color: var(--tree); }
    #scene-empty { padding: 10px; color: var(--ink-dim); font-size: 12px; }
    #scene footer { display: flex; gap: 4px; padding: 6px; border-top: 1px solid var(--line); }
    #scene footer button { flex: 1; min-height: 34px; padding: 0 8px; font-size: 12px; }

    /* Status line. Says what a tap will do right now. */
    #hint {
        position: absolute;
        top: 12px; left: 12px;
        max-width: 320px;
        padding: 8px 12px;
        background: rgba(30, 30, 30, 0.94);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 12px;
        color: var(--ink-dim);
        z-index: 5;
    }
    #hint b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>

<div id="map"></div>

<div id="hint">Pick a tool below. The table shows the result as you commit.</div>

<div id="scene">
    <header><span>Scene</span><span id="scene-count">0</span></header>
    <ul id="scene-list"></ul>
    <div id="scene-empty">Nothing placed yet.</div>
    <footer>
        <button class="minor" id="undo-btn">Undo</button>
        <button class="minor" id="clear-btn">Clear all</button>
    </footer>
</div>

<div id="pending">
    <span id="pending-label"></span>
    <div id="height-row">
        <label for="height">Height</label>
        <input type="range" id="height" min="6" max="80" step="2" value="18">
        <span id="height-value">18 m</span>
    </div>
    <button class="minor" id="cancel-btn">Cancel</button>
    <button class="commit" id="commit-btn">Place</button>
</div>

<div id="tools">
    <button class="tool" data-tool="block" aria-pressed="false">Block<small>tap corners</small></button>
    <button class="tool" data-tool="street" aria-pressed="false">Pedestrianise<small>tap a street</small></button>
    <button class="tool" data-tool="treeline" aria-pressed="false">Tree belt<small>tap a line</small></button>
</div>

<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="scene.js"></script>
<script src="authoring.js"></script>
</body>
</html>
